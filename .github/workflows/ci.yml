name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-fingerprint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git log order

      - name: Install Bazelisk
        run: |
          mkdir -p $HOME/.local/bin
          curl -Lo $HOME/.local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x $HOME/.local/bin/bazel
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/BUILD', '**/*.bzl') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build
        run: bazel build //cpp/renderer:render_cli //rust/cli:fractal_cli

      - name: Test
        run: bazel test //cpp/renderer:renderer_test --test_output=errors

      - name: Generate build events
        run: bazel build //... --build_event_json_file=build_events.json || true

      - name: Install Python deps
        run: pip install Pillow --quiet

      - name: Evolve fractal fingerprint
        run: |
          cd python/tools
          python3 evolve_fractal.py \
            --bep ../../build_events.json \
            --state ../../fingerprints/state.json \
            --out ../../fingerprint.ppm \
            --render-cli ../../bazel-bin/cpp/renderer/render_cli \
            --sha ${{ github.sha }}
          cd ../..

      - name: Convert PPM to PNG
        run: |
          sudo apt-get install -y imagemagick
          convert fingerprint.ppm fingerprint.png

      - name: Commit fingerprint and state
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p fingerprints
          cp fingerprint.png fingerprints/${{ github.sha }}.png
          cp fingerprint.png fingerprints/latest.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add fingerprints/latest.png fingerprints/${{ github.sha }}.png fingerprints/state.json
          git diff --staged --quiet || git commit -m "fingerprint: ${{ github.sha }}"
          git push

      - name: Pull latest fingerprints
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git pull --no-edit

      - name: Generate history GIF
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 python/tools/make_gif.py \
            --fingerprints-dir fingerprints \
            --out fingerprints/history.gif \
            --frames 10 \
            --duration 800

      - name: Commit GIF
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git add fingerprints/history.gif
          git diff --staged --quiet || git commit -m "update history gif"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-fingerprint-${{ github.sha }}
          path: |
            fingerprint.png
            fingerprints/history.gif