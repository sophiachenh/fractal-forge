name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-fingerprint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need parent commit for git diff

      - name: Install Bazelisk
        run: |
          mkdir -p $HOME/.local/bin
          curl -Lo $HOME/.local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x $HOME/.local/bin/bazel
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/BUILD', '**/*.bzl') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build
        run: bazel build //cpp/renderer:render_cli //rust/cli:fractal_cli

      - name: Test
        run: bazel test //cpp/renderer:renderer_test --test_output=errors

      - name: Benchmark
        run: |
          RENDER_CLI_PATH=$(pwd)/bazel-bin/cpp/renderer/render_cli \
            ./rust/cli/target/release/fractal bench --runs 3 \
            || bazel run //rust/cli:fractal_cli -- bench --runs 3

      - name: Generate build fingerprint
        run: |
          bazel build //... --build_event_json_file=build_events.json || true
          python3 python/tools/bep_to_fractal.py \
            --bep build_events.json \
            --out fingerprint.ppm \
            --render-cli bazel-bin/cpp/renderer/render_cli \
            --sha HEAD

      - name: Convert PPM to PNG
        run: |
          sudo apt-get install -y imagemagick
          convert fingerprint.ppm fingerprint.png

      - name: Upload fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: build-fingerprint-${{ github.sha }}
          path: fingerprint.png

      - name: Commit fingerprint to repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p fingerprints
          cp fingerprint.png fingerprints/${{ github.sha }}.png
          cp fingerprint.png fingerprints/latest.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add fingerprints/
          git diff --staged --quiet || git commit -m "fingerprint: ${{ github.sha }}"
          git push